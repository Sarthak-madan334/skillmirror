openapi: 3.1.0
info:
  title: SkillMirror API
  version: 1.0.0
  description: >-
    Implemented API for owned training, local media metadata, learner sessions,
    human-reviewed attempts, and recorded reports. The sample generator is a
    deterministic template, not an AI service. No endpoint performs computer vision.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Health
  - name: Authentication
  - name: Training
  - name: Learning
  - name: Media
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: API process is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
  /ready:
    get:
      tags: [Health]
      summary: Database readiness probe
      responses:
        '200': { description: Database query succeeded }
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 12, maxLength: 128, description: At least 12 characters including upper/lower case and a number. }
      responses:
        '202': { description: Generic registration accepted response; sign in separately. Response does not reveal whether email already existed. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Registration unavailable for these details }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Signed in; sets an HttpOnly session cookie }
        '401': { description: Generic invalid credentials response }
  /auth/logout:
    post:
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Session invalidated and cookie cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Authentication]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Current user profile }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /trainings:
    get:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: status, schema: { type: string, enum: [draft, published, archived] } }
      responses:
        '200': { description: Paginated guides owned by the caller }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingInput' }
      responses:
        '201': { description: Created training project and ordered steps }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /trainings/{trainingId}:
    parameters:
      - { $ref: '#/components/parameters/TrainingId' }
    get:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Owner-visible training or published training }
        '404': { description: Not found or not visible to this caller }
    patch:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingPatch' }
      responses:
        '200': { description: Updated training project }
        '409': { description: Procedure history prevents this update }
        '422': { description: Cannot publish without steps }
    delete:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Training deleted }
        '404': { description: Not found or not owned }
        '409': { description: Training has sessions; archive it instead }
  /trainings/{trainingId}/procedure:
    put:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingInput' }
      responses:
        '200': { description: Atomically replaced owner procedure }
        '409': { description: Training already has learner sessions }
  /trainings/{trainingId}/generate-steps:
    post:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { const: demo }
      responses:
        '200': { description: Sample-only paper bridge draft; provenance demo-template, simulated true, approved false }
        '422': { description: Demo template only supports the paper bridge task; no media was analyzed }
  /trainings/{trainingId}/progress:
    get:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
      responses:
        '200': { description: Sessions and attempts for the current learner }
  /trainings/{trainingId}/steps:
    post:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepInput' }
      responses:
        '201': { description: Step added at the end of the procedure }
        '409': { description: Training has learner sessions }
  /trainings/{trainingId}/steps/reorder:
    put:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stepIds]
              properties:
                stepIds: { type: array, minItems: 1, maxItems: 50, uniqueItems: true, items: { type: string } }
      responses:
        '200': { description: Steps reordered transactionally }
        '400': { description: IDs are missing, duplicated, or do not belong to the training }
  /trainings/{trainingId}/steps/{stepId}:
    patch:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
        - { in: path, name: stepId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepPatch' }
      responses:
        '200': { description: Step updated }
        '409': { description: Training has learner sessions }
    delete:
      tags: [Training]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
        - { in: path, name: stepId, required: true, schema: { type: string } }
      responses:
        '204': { description: Step deleted and subsequent positions compacted }
        '409': { description: Training has learner sessions }
  /trainings/{trainingId}/sessions:
    post:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
      responses:
        '201': { description: Session created }
        '200': { description: Existing in-progress session resumed }
        '422': { description: Training is not published or has no steps }
  /sessions/{sessionId}:
    get:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      responses:
        '200': { description: Session, ordered procedure, attempts, and evidence metadata }
        '404': { description: Session is not visible to caller }
  /sessions/{sessionId}/progress:
    patch:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPosition]
              properties:
                currentPosition: { type: integer, minimum: 0, maximum: 49 }
                status: { type: string, enum: [IN_PROGRESS, PAUSED] }
      responses:
        '200': { description: Progress updated }
        '403': { description: Only the learner can update progress }
        '409': { description: Session completed or invalid transition }
  /sessions/{sessionId}/media:
    post:
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, stepId]
              properties:
                file: { type: string, format: binary }
                stepId: { type: string }
      responses:
        '201': { description: Private media asset metadata }
        '413': { description: File exceeds 250 MiB }
        '415': { description: MIME allowlist or detected file content mismatch }
  /sessions/{sessionId}/steps/{stepId}/attempts:
    post:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { in: path, name: stepId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evidenceIds: { type: array, maxItems: 5, items: { type: string } }
      responses:
        '201': { description: Needs review with owned evidence, otherwise unable to verify; never auto-passed }
        '400': { description: Invalid evidence references }
  /sessions/{sessionId}/attempts:
    get:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      responses:
        '200': { description: Attempts with step and evidence metadata }
  /sessions/{sessionId}/attempts/{attemptId}/review:
    patch:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
        - { in: path, name: attemptId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, feedback]
              properties:
                status: { type: string, enum: [PASSED, NEEDS_IMPROVEMENT, UNABLE_TO_VERIFY] }
                feedback: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: Human review recorded by project owner }
        '409': { description: Attempt is not awaiting review }
  /sessions/{sessionId}/complete:
    post:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      responses:
        '200': { description: Complete report based on reviewed attempts }
        '409': { description: Every step does not have a latest human-reviewed pass }
  /sessions/{sessionId}/report:
    get:
      tags: [Learning]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      responses:
        '200': { description: Stored report summary derived from attempt records }
  /trainings/{trainingId}/media:
    post:
      tags: [Media]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/TrainingId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                stepId: { type: string }
      responses:
        '201': { description: Private local media asset metadata }
        '413': { description: File exceeds 250 MiB }
        '415': { description: Unsupported or mismatched file content }
  /media/{assetId}:
    parameters:
      - { in: path, name: assetId, required: true, schema: { type: string } }
    get:
      tags: [Media]
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Authorized private asset bytes; no-store caching }
        '404': { description: Asset not found or not visible to caller }
    delete:
      tags: [Media]
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Unattached owned asset removed }
        '409': { description: Attempt evidence cannot be deleted }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: skillmirror_session
  parameters:
    TrainingId:
      in: path
      name: trainingId
      required: true
      schema: { type: string }
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: true }
        data: { type: object }
        error: { type: 'null' }
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { type: boolean, const: false }
        data: { type: 'null' }
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    StepInput:
      type: object
      required: [title, instructions]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        instructions: { type: string, minLength: 1, maxLength: 2000 }
        expected: { type: string, maxLength: 1000 }
        verification: { type: string, maxLength: 1000 }
        safety: { type: string, maxLength: 1000 }
        image: { type: string, format: uri, maxLength: 2048 }
        feedback: { type: string, maxLength: 1000 }
    StepPatch:
      allOf:
        - { $ref: '#/components/schemas/StepInput' }
      description: Partial StepInput; at least one field is required.
    TrainingInput:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        category: { type: string, maxLength: 80 }
        level: { type: string, maxLength: 40 }
        duration: { type: integer, minimum: 1, maximum: 600 }
        objectives: { type: string, maxLength: 500 }
        materials: { type: array, maxItems: 50, items: { type: string, maxLength: 120 } }
        status: { type: string, enum: [draft, published] }
        demonstration: { type: object, nullable: true, properties: { mode: { type: string, enum: [sample, local] }, name: { type: string, maxLength: 255 } } }
        steps: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/StepInput' } }
    TrainingPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        category: { type: string, maxLength: 80 }
        level: { type: string, maxLength: 40 }
        duration: { type: integer, minimum: 1, maximum: 600 }
        objectives: { type: string, maxLength: 500 }
        materials: { type: array, maxItems: 50, items: { type: string, maxLength: 120 } }
        status: { type: string, enum: [draft, published, archived] }
        demonstration: { type: object, nullable: true }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }